# fly.toml app configuration file generated for masklm-daiki on 2026-05-21T15:11:29Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'masklm-daiki'
primary_region = 'sjc'

[build]

[env]
  ALLOWED_ORIGINS = 'http://localhost:5173,http://localhost:3000'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
